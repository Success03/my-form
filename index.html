height:44px}.text-btn{border:0;background:none;color:#697666;text-decoration:underline;font-weight:700;font-size:12px;padding:8px}.muted-status{font-size:12px;color:#879186}

<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="logo">MY FORM<span class="dot">.</span></div>
      <div class="brand-sub">MOVE AT YOUR PACE</div>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-bottom"><strong>너의 페이스로, 꾸준히 🌿</strong><p>남과 비교하지 않고 어제의 나보다 한 걸음씩.</p></div>
    </aside>
    <main>
      <div class="topline"><div><div class="overline">MY PERSONAL FITNESS SPACE</div><div class="date-head" id="headerDate"></div></div><div class="round-icon" aria-label="나만의 앱">MF</div></div>
      <section class="view active" id="view-today"></section>
      <section class="view" id="view-plan"></section>
      <section class="view" id="view-history"></section>
      <section class="view" id="view-settings"></section>
      <div class="footer">MY FORM · 내 기록은 이 기기에만 저장돼요.<br>이 앱은 의료진의 운동 허가를 대신하지 않습니다.</div>
    </main>
  </div>
  <nav class="bottom-nav" id="bottomNav" aria-label="하단 메뉴"></nav>
  <div class="modal-shade" id="modalShade" role="dialog" aria-modal="true" aria-label="운동 설명"><div class="modal" id="modalBody"></div></div>

<script>
(()=>{'use strict';
  const DBKEY='my-form-app-v1';
  const VIDEO_NHS='https://www.nhs.uk/live-well/exercise/strength-and-flex-exercise-plan-how-to-videos/';
  const VIDEO_STRENGTH='https://www.nhs.uk/live-well/exercise/strength-exercises/';
  const videoSearch=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q);
  const EX={
    kick:{name:'스탠딩 글루트 킥백',part:'엉덩이 뒤쪽',dose:'다리당 10~12회',type:'근력',steps:['미끄러지지 않는 의자 등받이를 잡고 발을 골반 너비로 벌려 서요.','무릎을 아주 살짝 구부린 상태에서 한쪽 다리를 뒤로 천천히 움직여요.','골반은 정면을 향하게 두고 허리가 젖혀지지 않도록 작은 범위에서 움직여요.','다리를 천천히 원래 위치로 되돌리고 반대쪽도 반복해요.','다리를 보낼 때 편안하게 숨을 내쉬고 절대로 숨을 참지 마세요.'],caution:'다리를 크게 차올리거나 복부에 힘을 주어 버티지 마세요.',video:VIDEO_STRENGTH,videoLabel:'NHS 다리 뒤로 들기 설명',search:videoSearch('NHS standing leg extension glute kickback exercise')},
    side:{name:'스탠딩 사이드 레그 레이즈',part:'엉덩이 옆쪽',dose:'다리당 10~12회',type:'근력',steps:['의자 옆에 서서 손으로 가볍게 지지해요.','발끝과 무릎을 정면으로 두고 골반을 수평으로 유지해요.','한쪽 다리를 옆으로 천천히 들어 올려요.','허리를 기울이지 않고 편안한 높이에서 내려와요.','반대편도 같은 방식으로 반복해요.'],caution:'골반이 기울거나 배가 당기면 동작 범위를 줄이세요.',video:VIDEO_STRENGTH,videoLabel:'NHS 옆으로 다리 들기 설명',search:videoSearch('standing hip abduction exercise physiotherapy video')},
    chair:{name:'의자 스쿼트',part:'힙 · 허벅지',dose:'8~10회',type:'근력',steps:['바퀴 없는 튼튼한 의자에 앉아 발을 골반 너비로 벌려요.','발바닥 전체가 바닥에 닿도록 하고 시선은 정면으로 둬요.','상체를 살짝 앞으로 기울이고, 필요하면 팔걸이나 손으로 몸을 지지해요.','일어날 때 숨을 내쉬며 천천히 일어서요.','숨을 이어가며 천천히 다시 앉아요.'],caution:'배에 힘을 주어 버티지 마세요. 힘들면 손을 이용해서 난이도를 낮춰요.',video:VIDEO_NHS,videoLabel:'NHS Sit-to-stand 영상',search:videoSearch('NHS strength flexibility sit to stand exercise')},
    calf:{name:'스탠딩 카프 레이즈',part:'종아리',dose:'12~15회',type:'근력',steps:['의자 뒤에 서서 등받이를 안정적으로 잡아요.','발을 골반 너비로 놓고 무릎에 과한 힘을 주지 않아요.','발뒤꿈치를 천천히 들어 발끝 쪽으로 올라가요.','잠시 균형을 잡고 천천히 발뒤꿈치를 내려요.','반동 없이 편안하게 반복해요.'],caution:'발목이 불안정하거나 복부에 부담이 느껴지면 중단하세요.',video:VIDEO_NHS,videoLabel:'NHS 카프 레이즈 영상',search:videoSearch('NHS calf raise standing exercise')},
    wallpush:{name:'벽 푸시업',part:'가슴 · 팔',dose:'8~10회',type:'근력',steps:['벽 앞에 서서 양손을 어깨너비와 가슴 높이로 벽에 대요.','발을 너무 멀리 두지 않아 몸통 부담을 낮춰요.','팔꿈치를 천천히 굽히며 가슴이 벽 쪽으로 가까워지게 해요.','숨을 내쉬면서 벽을 부드럽게 밀고 원래 위치로 돌아와요.','허리가 꺾이거나 배가 당기면 즉시 멈춰요.'],caution:'플랭크처럼 배를 강하게 조이는 느낌이 들면 더 가까이 서거나 생략해요.',video:VIDEO_NHS,videoLabel:'NHS 스탠딩 푸시업 영상',search:videoSearch('NHS standing press up wall push up')},
    wallslide:{name:'월 슬라이드',part:'어깨 · 자세',dose:'10회',type:'근력',steps:['벽에 등을 편안하게 기대고 발은 조금 앞으로 둬요.','양팔을 W 모양으로 구부리고 어깨에 힘을 빼요.','양팔을 천천히 벽을 따라 위로 밀어요.','어깨가 불편하지 않은 높이까지만 올린 뒤 천천히 내려요.','허리를 뒤로 젖히지 말고 자연스럽게 호흡해요.'],caution:'팔이나 어깨에 찌릿한 통증이 생기면 중단하세요.',video:'https://www.nhsinform.scot/illnesses-and-conditions/muscle-bone-and-joints/arm-shoulder-and-hand-problems-and-conditions/exercises-for-shoulder-problems/',videoLabel:'NHS 어깨 운동 자료',search:videoSearch('wall slide shoulder exercise physiotherapy demonstration')},

    ${isRest?`<div class="tiny-note">오늘은 휴식일이야. 가볍게 쉬고 다음 주를 준비하자. 휴식일은 운동 완료율에 포함하지 않아.</div>`:`<div class="tiny-note">⚕️ 개복수술 후 복압을 조심하라는 안내를 받았으므로 근력 운동 및 골반·복부 동작은 의료진의 허용 범위에서만 진행해. 통증·당김·불룩해짐이 생기면 중단해.</div><div class="tasklist">${plan.ids.map(id=>{const ex=EX[id];const locked=!!ex.clearance&&!store.cleared;const checked=(r.checks||[]).includes(id);return `<div class="taskitem ${checked?'done':''}" style="${locked?'opacity:.67;':''}"><button class="check-btn" data-toggle-id="${id}" ${locked?'disabled':''} aria-label="${esc(ex.name)} ${locked?'허용 전 잠금':checked?'완료 취소':'완료 체크'}">${locked?'🔒':checked?'✓':''}</button><div><span class="task-name">${esc(ex.name)}${locked?' <span style="font-weight:600;color:#b08355;font-size:10px">· 의료진 확인 전 제외</span>':ex.clearance?' <span style="font-weight:600;color:#668359;font-size:10px">· 허용됨</span>':''}</span><div class="task-meta">${esc(doseFor(id,selectedDate))}</div></div><button class="detail-btn" data-detail="${id}" aria-label="${esc(ex.name)} 자세 보기">↗</button></div>`}).join('')}</div><textarea class="note-textarea" id="dayNote" maxlength="300" placeholder="오늘의 컨디션이나 운동 메모 (선택)">${esc(r.note||'')}</textarea><div class="button-row"><button class="primary ${r.complete?'done':''}" id="completeDay">${r.complete?'✓ 운동 완료됨 · 취소하기':'오늘 운동 완료하기'}</button><span class="muted-status">${(r.checks||[]).filter(id=>activeIds(plan).includes(id)).length} / ${activeIds(plan).length}개 체크</span></div>`}</div><div class="notice">운동 영상을 보기 전에 의사에게 해당 동작이 적절한지 확인해. 영상은 자세 참고용이며 의학적 개인 처방이 아니야.</div>`
  }
  function renderPlan(){el('view-plan').innerHTML=`<div class="overline">YOUR MOVEMENT MAP</div><h1 style="font-size:29px;letter-spacing:-1px;margin:9px 0 0">나의 일주일 루틴</h1><p class="section-intro">매트와 안정적인 의자만 있으면 시작할 수 있어. 각 카드를 누르면 해당 날짜의 운동을 확인할 수 있어.</p><div class="routines">${DAYS.map((d,i)=>`<button class="routine-tile tile-${d.color}" data-open-day="${i}"><div class="tile-symbol">${d.symbol}</div><div class="overline">${['MON','TUE','WED','THU','FRI','SAT','SUN'][i]}</div><div class="tile-name">${esc(d.name)}</div><div class="tile-meta">${d.minutes} · ${d.type}</div><div class="tile-foot">${d.ids.length?d.ids.length+'가지 활동':'충분히 회복하기'} &nbsp; ↗</div></button>`).join('')}</div><div class="settings-card" style="margin-top:20px"><h3>4주 진행 방법</h3><p>첫 주는 근력 동작당 1세트, 이후 불편함이 없고 의료진이 허용한 경우 2세트로 늘려요. 복부 재활은 별도 표기 횟수를 유지하고 강도를 임의로 높이지 않아요.</p><div class="pill-row"><span class="pill">1주: 근력 1세트</span><span class="pill">2~4주: 허용 시 2세트</span><span class="pill purple">무거운 중량 제외</span></div></div>`}
  function renderHistory(){const monday=addDays(startOfWeek(new Date()),historyOffset*7);const last=addDays(monday,6);let historyCells='';let logs='';for(let i=0;i<7;i++){const date=localISO(addDays(monday,i));const r=getRecord(date),isRest=i===6,complete=!!r.complete;historyCells+=`<button class="history-day ${complete?'yes':''} ${isRest?'empty':''} ${date===localISO(new Date())?'today':''}" data-history-date="${date}"><small>${['월','화','수','목','금','토','일'][i]}</small>${complete?'✓':isRest?'—':fromISO(date).getDate()}</button>`;if(!isRest){const d=DAYS[i];logs+=`<div class="log-item"><div><strong>${['월','화','수','목','금','토','일'][i]} · ${esc(d.short)}</strong><span>${fromISO(date).getMonth()+1}/${fromISO(date).getDate()} · ${(r.checks||[]).filter(id=>activeIds(d).includes(id)).length}/${activeIds(d).length}개 체크${r.note?' · 메모 있음':''}</span></div><div style="font-weight:800;color:${complete?'#608641':'#afb6a8'}">${complete?'완료':'미완료'}</div></div>`}}
    el('view-history').innerHTML=`<div class="overline">YOUR PROGRESS</div><h1 style="font-size:29px;letter-spacing:-1px;margin:9px 0 0">운동 기록</h1><p class="section-intro">한 번씩 체크한 작은 기록들이 모여 습관이 돼.</p><div class="stat-row"><div class="stat"><div class="stat-label">전체 완료일</div><div class="stat-val">${totalCompleted()}</div><div class="stat-foot">누적</div></div><div class="stat"><div class="stat-label">이번 주</div><div class="stat-val">${weekCompleted(localISO(new Date()))}<span style="font-size:12px;color:#979f93"> / 6</span></div><div class="stat-foot">운동일</div></div><div class="stat"><div class="stat-label">시작일</div><div class="stat-val" style="font-size:18px;margin-top:11px">${esc(store.startDate.slice(5).replace('-','/'))}</div><div class="stat-foot">변경 가능</div></div></div><div class="workout-card"><div class="history-top"><h2 class="section-title">${monday.getMonth()+1}월 ${monday.getDate()}일 ~ ${last.getMonth()+1}월 ${last.getDate()}일</h2><div class="week-switch"><button class="circle-btn" data-history-step="-1" aria-label="지난주">‹</button><button class="circle-btn" data-history-step="1" aria-label="다음주">›</button></div></div><div class="history-grid">${historyCells}</div><p class="small-muted">완료한 날은 초록색으로 표시돼. 날짜를 누르면 해당 운동 기록을 확인하고 수정할 수 있어.</p><div class="log-list">${logs}</div></div>`
  }
  function renderSettings(){el('view-settings').innerHTML=`<div class="overline">MAKE IT YOURS</div><h1 style="font-size:29px;letter-spacing:-1px;margin:9px 0 0">내 앱 설정</h1><p class="section-intro">운동 시간과 기록을 내 생활에 맞게 관리해.</p><div class="settings-card"><h3>⏰ 운동 리마인더</h3><p>앱을 닫아도 알림을 받으려면 캘린더에 4주 운동 일정을 추가해. 매일 운동 종류에 맞춰 표시되고, 시작 10분 전에 알림이 울리도록 설정돼. 실제 알림은 사용 중인 캘린더 설정에 따라 달라질 수 있어.</p><div class="form-grid"><div class="field"><label for="startInput">4주 프로그램 시작일</label><input type="date" id="startInput" value="${esc(store.startDate)}" /></div><div class="field"><label for="timeInput">운동 알림 시간</label><input type="time" id="timeInput" value="${esc(store.reminder)}" /></div></div><div style="margin-top:15px;padding:13px;border-radius:12px;background:#f6f4fb;font-size:12px"><label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input type="checkbox" id="clearanceInput" ${store.cleared?'checked':''} style="width:17px;height:17px;margin-top:2px;accent-color:#526d4c"><span><strong>복부 재활 동작에 대해 의료진의 개별 허용을 받았어요.</strong><br>허용 전에는 펠빅 틸트·힐 슬라이드가 잠겨 있고, 오늘 운동 완료에 포함되지 않아요.</span></label></div><div class="settings-btns"><button class="primary" id="saveSettings">설정 저장</button><button class="secondary" id="downloadCalendar">📅 캘린더 알림 파일 받기</button></div><p style="margin-top:12px;margin-bottom:0">아이폰의 홈 화면에 설치하더라도, 서버 없는 웹앱은 종료된 상태에서 직접 푸시 알림을 보장할 수 없어. 캘린더 알림을 사용하는 방식이야.</p></div><div class="settings-card"><h3>📱 홈 화면에 앱 추가</h3><p>인터넷에 올린 주소로 접속한 다음 홈 화면에 추가하면 일반 앱처럼 아이콘을 눌러 실행할 수 있어.</p><ol class="bullets"><li>아이폰 Safari에서 앱 주소를 열기</li><li>공유 버튼 → <strong>홈 화면에 추가</strong></li><li>MY FORM을 눌러 실행하기</li></ol><div class="tiny-note">단독 HTML 파일도 PC에서는 바로 실행할 수 있어. 아이폰에서 안정적인 홈 화면 앱과 오프라인 기능을 사용하려면 HTTPS 웹 호스팅이 필요해.</div></div><div class="settings-card"><h3>🔐 내 기록 백업</h3><p>기록은 이 브라우저의 저장 공간에만 남아. 다른 기기에서 자동 동기화되지 않으니 백업 파일을 보관하는 것을 권장해.</p><div class="settings-btns"><button class="secondary" id="exportData">기록 내보내기 (.json)</button><button class="secondary" id="importData">기록 가져오기</button><input id="importFile" type="file" accept="application/json,.json" style="display:none" /></div><div class="settings-btns"><button class="text-btn" id="resetData">모든 기록 초기화</button></div></div><div class="notice">⚕️ 운동 전: 복압·중량 제한을 준수하고, 특히 복부 재활과 근력 운동 동작별 허용 여부를 의료진에게 확인해. 복대는 안내받은 방법대로 착용해. 복부 통증, 출혈, 수술 부위 불룩해짐, 어지럼증이 생기면 중단하고 진료를 받아.</div>`}
  function draw(){nav();renderToday();renderPlan();renderHistory();renderSettings()}
  function showView(key){if(!pageKeys.some(x=>x[0]===key))return;view=key;draw();window.scrollTo({top:0,behavior:'smooth'})}
  function selectDate(date){selectedDate=date;showView('today')}
  function toggleCheck(id){const d=DAYS[dayIdx(fromISO(selectedDate))];if(!activeIds(d).includes(id))return;const r=record(selectedDate);r.checks=r.checks.includes(id)?r.checks.filter(x=>x!==id):[...r.checks,id];if(r.complete && activeIds(d).some(id=>!r.checks.includes(id)))r.complete=false;persist();renderToday()}
  function completeDay(){const d=DAYS[dayIdx(fromISO(selectedDate))];if(!d.ids.length)return;const r=record(selectedDate);if(r.complete){r.complete=false;persist();renderToday();toast('운동 완료 표시를 취소했어.');return}const ids=activeIds(d),count=ids.filter(id=>r.checks.includes(id)).length;if(count!==ids.length){toast('먼저 완료한 활동을 모두 체크해 주세요.');return}r.complete=true;persist();draw();toast('오늘 운동 완료! 잘했어 🌿')}
  function exerciseModal(id){const e=EX[id];if(!e)return;el('modalBody').innerHTML=`<button class="close-modal" data-close-modal aria-label="닫기">×</button><div class="modal-label">${esc(e.type)} · 운동 가이드</div><h2>${esc(e.name)}</h2><div class="modal-meta">${esc(e.part)} · ${esc(doseFor(id,selectedDate))}</div><h4>이렇게 따라 해요</h4><ol>${e.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol><h4>안전하게 운동하기</h4><div class="warning">${esc(e.caution)}${e.clearance?' 이 동작은 복부에 힘이 들어갈 수 있으므로 의료진의 개별 허용이 필요해.':''}</div><div class="modal-actions"><a class="primary" href="${e.video}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center">▶ ${esc(e.videoLabel)}</a>${e.search?`<a class="secondary" href="${e.search}" target="_blank" rel="noopener noreferrer" style="text-decoration:none">다른 영상 찾아보기</a>`:''}</div><p style="font-size:11px;color:#909991;margin-top:14px">외부 영상은 자료 제공처의 사이트에서 열려요. 운동 설명과 영상이 완전히 일치하지 않을 수 있으므로 무리하지 마세요.</p>`;el('modalShade').classList.add('show');document.body.style.overflow='hidden'}
  function hideModal(){el('modalShade').classList.remove('show');document.body.style.overflow=''}
  function saveSettings(){const start=el('startInput').value,time=el('timeInput').value;if(!/^\d{4}-\d\d-\d\d$/.test(start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)){toast('시작일과 알림 시간을 확인해 주세요.');return}store.startDate=start;store.reminder=time;store.cleared=!!el('clearanceInput')?.checked;persist();draw();toast('설정을 저장했어.')}
  function fileDownload(name,content,type){const blob=new Blob([content],{type});const link=document.createElement('a');const url=URL.createObjectURL(blob);link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000)}
  function icsEscape(s){return String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
  function generateICS(){const time=(el('timeInput')?.value)||store.reminder;const start=(el('startInput')?.value)||store.startDate;if(!/^\d{4}-\d\d-\d\d$/.test(start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(time)){toast('알림 설정을 먼저 확인해 주세요.');return}saveSettings();const now=new Date();const stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'+pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z';const compact=s=>s.replace(/-/g,'');let lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//MY FORM//Personal Workout Calendar//KO','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:MY FORM 4주 운동 알림'];const st=fromISO(start);for(let i=0;i<28;i++){const date=addDays(st,i),ix=dayIdx(date),plan=DAYS[ix];if(ix===6)continue;const dateStr=localISO(date);const tm=time.replace(':','');const finish=new Date(date);finish.setHours(+time.slice(0,2),+time.slice(3),0,0);finish.setMinutes(finish.getMinutes()+Math.max(20,parseInt(plan.minutes,10)||20));const end=localISO(finish).replace(/-/g,'')+'T'+pad(finish.getHours())+pad(finish.getMinutes())+'00';const dt=compact(dateStr)+'T'+tm+'00';lines.push('BEGIN:VEVENT',`UID:myform-${dateStr}@personal.local`,'DTSTAMP:'+stamp,'DTSTART:'+dt,'DTEND:'+end,'SUMMARY:'+icsEscape('MY FORM · '+plan.name),'DESCRIPTION:'+icsEscape('오늘의 운동: '+plan.name+' | '+plan.minutes+' | 복압·중량 제한 주의'), 'BEGIN:VALARM','TRIGGER:-PT10M','ACTION:DISPLAY','DESCRIPTION:'+icsEscape('10분 후 운동: '+plan.name),'END:VALARM','END:VEVENT')}lines.push('END:VCALENDAR');fileDownload('MY_FORM_4주_운동알림.ics',lines.join('\r\n')+'\r\n','text/calendar;charset=utf-8');toast('4주 캘린더 파일을 만들었어. 캘린더에 가져와야 알림이 등록돼.')}
  function exportJSON(){fileDownload('MY_FORM_운동기록_'+localISO(new Date())+'.json',JSON.stringify({version:1,startDate:store.startDate,reminder:store.reminder,records:store.records},null,2),'application/json;charset=utf-8');toast('기록을 내보냈어.')}
  function importJSON(file){if(!file||file.size>1000000){toast('1MB 이하의 JSON 파일을 선택해 주세요.');return}file.text().then(s=>{try{const obj=JSON.parse(s);if(!obj||!obj.records||typeof obj.records!=='object'||Array.isArray(obj.records))throw Error('형식');const valid={};for(const [date,r] of Object.entries(obj.records)){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!r||typeof r!=='object')continue;valid[date]={checks:Array.isArray(r.checks)?r.checks.filter(id=>EX[id]).slice(0,20):[],complete:!!r.complete,note:typeof r.note==='string'?r.note.slice(0,300):''}};store.records=valid;if(/^\d{4}-\d{2}-\d{2}$/.test(obj.startDate||''))store.startDate=obj.startDate;if(/^([01]\d|2[0-3]):[0-5]\d$/.test(obj.reminder||''))store.reminder=obj.reminder;persist();draw();toast('기록을 가져왔어.')}catch(e){toast('MY FORM 기록 파일이 아니거나 손상됐어.')}})}
  document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;
    if(btn.dataset.view){showView(btn.dataset.view);return}if(btn.dataset.selectDate){selectDate(btn.dataset.selectDate);return}if(btn.dataset.openDay!==undefined){const i=Number(btn.dataset.openDay),monday=startOfWeek(new Date());selectDate(localISO(addDays(monday,i)));return}if(btn.dataset.toggleId){toggleCheck(btn.dataset.toggleId);return}if(btn.dataset.detail){exerciseModal(btn.dataset.detail);return}if(btn.dataset.closeModal!==undefined){hideModal();return}if(btn.dataset.historyStep){historyOffset+=Number(btn.dataset.historyStep);renderHistory();return}if(btn.dataset.historyDate){selectDate(btn.dataset.historyDate);return}
    switch(btn.id){case'completeDay':completeDay();break;case'saveSettings':saveSettings();break;case'downloadCalendar':generateICS();break;case'exportData':exportJSON();break;case'importData':el('importFile').click();break;case'resetData':if(confirm('저장된 운동 기록을 모두 삭제할까요? 되돌릴 수 없어요.')){store.records={};persist();draw();toast('운동 기록을 초기화했어.')}break;}
  });
  document.addEventListener('input',e=>{if(e.target.id==='dayNote'){const r=record(selectedDate);r.note=e.target.value.slice(0,300);persist()}});
  document.addEventListener('change',e=>{if(e.target.id==='importFile'){importJSON(e.target.files?.[0]);e.target.value=''}});
  el('modalShade').addEventListener('click',e=>{if(e.target===el('modalShade'))hideModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')hideModal()});
  draw();
  if('serviceWorker'in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
})();
</script>
</body>
</html>
